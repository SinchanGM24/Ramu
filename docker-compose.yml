services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ramu}
      POSTGRES_USER: ${POSTGRES_USER:-ramu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ramu_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/init/001_app_role.sql:/docker-entrypoint-initdb.d/001_app_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: soldevelo/minio:2025.7.23
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ramu_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ramu_minio_password}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://ramu_app:${POSTGRES_APP_PASSWORD:-ramu_app_local_password}@postgres:5432/${POSTGRES_DB:-ramu}
      SESSION_COOKIE_NAME: ramu_session
      SESSION_TTL_DAYS: 7
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: ramu-private
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-ramu_minio}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ramu_minio_password}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
